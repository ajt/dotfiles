# ~/.tmux.conf — standalone config (no framework)

# -- general -------------------------------------------------------------------

set -g default-terminal "screen-256color"
set -as terminal-features ',*:RGB'
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on

set -g prefix C-b
bind C-b send-prefix

set -g history-limit 5000

# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
setw -g monitor-activity on
set -g visual-activity off

# -- mouse & vi ----------------------------------------------------------------

set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

# -- key bindings --------------------------------------------------------------

# reload config
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# toggle the worktree issue notice box (worktree windows only)
bind b run-shell '~/bin/tmux-worktree-notice toggle'

# valvonta dashboard in a floating popup for the launching pane's repo (prefix + v).
# Toggle: inside the popup (a vlv-* session) -> detach-client (hide; valvonta keeps
# running); anywhere else -> open the popup. -d is format-expanded by tmux at run
# time (the display-popup shell-command is NOT — it would send a literal
# "#{pane_current_path}"), so the launcher reads its popup cwd ($PWD). The launcher
# attaches/creates a persistent per-repo `vlv-*` session running
# `valvonta --no-title --tmux-popup`: `j` jumps to the highlighted worktree's
# window in your real session and closes the popup (by @window-id, so it resolves
# from inside the popup's own session); `q` quits valvonta; prefix-v hides it.
bind v if-shell -F '#{m:vlv-*,#{session_name}}' {
  detach-client
} {
  display-popup -E -b rounded -T ' valvonta ' -w 80% -h 70% \
    -d '#{pane_current_path}' "$HOME/bin/tmux-valvonta-popup"
}

# edit config
bind e new-window -n '~/.tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\"'"

# session
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# window navigation
bind Tab last-window
bind -r C-h previous-window
bind -r C-l next-window

# splits — keep current path
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'

# pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# pane swapping
bind < swap-pane -U
bind > swap-pane -D

# enter copy mode
bind Enter copy-mode

# copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# copy to macOS clipboard
bind y run-shell -b 'tmux save-buffer - | pbcopy'

# clear screen + scrollback
bind -T root C-l send-keys C-l \; run-shell 'sleep 0.1' \; clear-history

# -- theme ---------------------------------------------------------------------

# pane borders
setw -g pane-border-style 'fg=#444444'
setw -g pane-active-border-style 'fg=#00afff'

# pane indicators
set -g display-panes-active-colour '#00afff'
set -g display-panes-colour '#00afff'

# messages
set -g message-style 'fg=#000000,bg=#ffff00,bold'
set -g message-command-style 'fg=#ffff00,bg=#000000,bold'

# mode (copy mode highlight)
setw -g mode-style 'fg=#000000,bg=#ffff00,bold'

# clock
setw -g clock-mode-colour '#00afff'
setw -g clock-mode-style 24

# -- status bar ----------------------------------------------------------------

set -g status-style 'fg=#8a8a8a,bg=#080808'

# left: session name (yellow) | uptime (pink)
set -g status-left-length 1000
set -g status-left '\
#[fg=#000000,bg=#ffff00,bold] ❐ #S \
#[fg=#ffff00,bg=#ff00af]\
#[fg=#e4e4e4,bg=#ff00af] #(~/bin/tmux-status.sh uptime) \
#[fg=#ff00af,bg=default] '

# right: prefix | battery | time | date | user (red) | host (white)
# battery variables are set by tmux-status.sh via #() trigger
set -g status-right-length 1000
set -g status-right '\
#[fg=#080808,bg=default]\
#[fg=#8a8a8a,bg=#080808]#{?client_prefix,⌨  ,}\
#(~/bin/claude-tmux-state gc)\
#(~/bin/tmux-status.sh battery > /dev/null)\
#{@battery_status} #{@battery_bar}#[fg=#8a8a8a] #{@battery_percentage} \
| %R \
| %d %b \
#[fg=#d70000,bg=#080808]\
#[fg=#e4e4e4,bg=#d70000] #(whoami) \
#[fg=#e4e4e4,bg=#d70000]\
#[fg=#000000,bg=#e4e4e4,bold] #H '

# window status
# tab anatomy: window number, then Claude Code's status glyph (if any), then the
# title — Claude's live pane_title while a session runs there, the window name
# otherwise. The glyph arrives pre-styled in @claude_tab (set, with @claude_state,
# by Claude Code hooks through bin/claude-tmux-state); the only state styled here
# is waiting (Claude blocked on the human) = loud orange fill. The title comes
# from the window's active pane, so a Claude running in a background pane of a
# multi-pane window can show the wrong title.
# the s/^[^a-zA-Z0-9] // strips Claude's own spinner prefix from the title — it
# only pseudo-animates at status redraws, and our glyph already carries state
# spacing around the status glyph lives in the @claude_tab fragment itself (the
# spinner has none — braille's in-cell margins are the gap); the ,<space> branch
# is the fallback gap for windows with no fragment
setw -g window-status-format '#{?#{==:#{@claude_state},waiting},#[fg=#000000]#[bg=#ff8700]#[bold] #I#{?@claude_tab,#{E:@claude_tab}, }#{?@wt_branch,⧉ ,}#{s/^[^a-zA-Z0-9] //;=20:pane_title} , #I#{?@claude_tab,#{E:@claude_tab}, }#{?@wt_branch,#[fg=#00afff]⧉ #[default],}#{?@claude_state,#{s/^[^a-zA-Z0-9] //;=20:pane_title},#{=14:window_name}} }'
setw -g window-status-style 'fg=#8a8a8a,bg=#080808'
setw -g window-status-activity-style 'fg=default,bg=default,underscore'
setw -g window-status-bell-style 'fg=#ffff00,bg=default,blink,bold'
setw -g window-status-last-style 'fg=#00afff,bg=default'
setw -g window-status-separator '#[fg=#444444]│#[default]'

# window current (powerline arrows) — same anatomy: number, status, title
setw -g window-status-current-format '\
#[fg=#080808,bg=#00afff]\
#[fg=#000000,bg=#00afff,bold] #I#{?@claude_tab,#{E:@claude_tab}, }#{?@wt_branch,⧉ ,}#{?@claude_state,#{s/^[^a-zA-Z0-9] //;=20:pane_title},#{=14:window_name}} \
#[fg=#00afff,bg=#080808]'
setw -g window-status-current-style 'fg=#000000,bg=#00afff,bold'

# -- claude state lifecycle ------------------------------------------------------

# acknowledge: focusing a window that finished its turn (✓ done) quiets it back
# to idle. focus-out too, so a ✓ earned while you were watching doesn't linger
# after you leave. Pure-format hooks — no subprocess on window switches.
set-hook -g pane-focus-in {
  if-shell -F '#{==:#{@claude_state},done}' {
    set-option -w @claude_state idle
    set-option -w @claude_tab ''
  }
}
set-hook -g pane-focus-out {
  if-shell -F '#{==:#{@claude_state},done}' {
    set-option -w @claude_state idle
    set-option -w @claude_tab ''
  }
}

# cleanup: the status bar's gc tick (see status-right) drops stale state from
# windows whose recorded Claude pane no longer exists (killed pane, crashed
# claude — cases where the SessionEnd hook never ran). A pane-exited hook can't
# do this: it fires with the *active* pane as context, not the dead one.
